<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Grant Aviation</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#000000">
  <script>
    // Apply the saved Profile "Text size" before first paint (app.js keeps it in sync afterwards).
    try {
      var ts = localStorage.getItem('grant-aviation-text-size');
      if (ts === 'large' || ts === 'xl') document.documentElement.dataset.textSize = ts;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/qrcode-generator.js"></script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <img class="brand-logo" src="logo.svg" alt="Grant Aviation logo" width="33" height="30">
        <div class="logo-text">Grant Aviation</div>
      </div>
      <div class="role-switch" role="group" aria-label="Mode">
        <button data-role="passenger">Passenger</button>
        <button data-role="employee">Employee</button>
      </div>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav">
      <button data-page="home" class="active">Home</button>
      <button data-page="book">Book</button>
      <button data-page="trips">My Trips</button>
      <button data-page="map">Map</button>
      <button data-page="profile">Profile</button>
    </nav>
  </div>

  <script>
    // Remove the service worker left over from the first tracker version so old cached pages stop showing.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
      if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
